<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Power fireball preview</title><style>body{margin:0;font:14px system-ui;background:#091426;color:white}header{position:fixed;inset:0 0 auto;z-index:2;padding:10px;background:#091426e8;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{padding:8px 12px;background:#233b53;color:white;border:1px solid #52788a;border-radius:6px;cursor:pointer}#court{position:absolute;inset:65px 0 0;overflow:hidden}.player-label,.turn-arrow,.serve-bubble,.thinking-bubble,.paused-ball-marker,.serve-aim-hint{display:none}</style><header><strong>Power fireball</strong><label>Power <select id="power"><option value=".5">50% — normal</option><option value=".89">89% — normal</option><option value=".9">90% — fire</option><option value="1" selected>100% — fire</option></select></label><label>Court <select id="location"><option value="forest">Forest</option><option value="glowball">Glowball</option><option value="jungle">Jungle</option></select></label><button id="pause">Pause</button><label>Flight <input id="seek" type="range" min="0" max="1" step=".001" value="0"></label></header><div id="court"></div><script type="module">
import {preloadAthletes} from '/src/athlete.ts';import {CourtScene} from '/src/scene.ts';import {Match} from '/src/match.ts';import {flightCursor,sampleLeg,sampleVelocity} from '/src/engine/rally-engine.ts';
await preloadAthletes();const scene=new CourtScene(document.querySelector('#court')),match=new Match(),shot=structuredClone(match.shot);scene.setGuides(false);scene.setPlayerNames(false);scene.resetCamera(15);shot.intent.power=1;
const duration=shot.legs.reduce((t,l)=>t+l.duration,0),seek=document.querySelector('#seek');let elapsed=0,previous=0,paused=false;
document.querySelector('#power').onchange=e=>shot.intent.power=Number(e.target.value);document.querySelector('#location').onchange=e=>scene.setLocation(e.target.value);document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause';};seek.oninput=()=>{elapsed=Number(seek.value)*duration;paused=true;document.querySelector('#pause').textContent='Play';};
function frame(now){if(!paused)elapsed=(elapsed+Math.min(.04,(now-previous)/1000))%duration;previous=now;const cursor=flightCursor(shot.legs,elapsed),leg=shot.legs[cursor.legIndex];Object.assign(match.state,{phase:'flight',paused,simulationTime:elapsed,...cursor});match.state.ball.position=sampleLeg(leg,cursor.elapsed/leg.duration);match.state.ball.velocity=sampleVelocity(leg,cursor.elapsed/leg.duration);seek.value=String(elapsed/duration);scene.render(match.state,now/1000,shot);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
