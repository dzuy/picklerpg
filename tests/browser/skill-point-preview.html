<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skill point celebration preview</title><link rel="stylesheet" href="/src/style.css"><body><dialog id="game-end" aria-label="Skill point preview"><div class="game-end-card"><div class="game-end-kicker">GAME COMPLETE</div><h1>You won!</h1><section id="reward" class="account-xp" aria-live="polite"></section><div class="game-end-actions"><button data-points="0">No point</button><button data-points="1">One point</button><button data-points="2">Two points</button></div><p id="preview-status" role="status"></p></div></dialog><script type="module">
import {renderXpReward} from '/src/account-xp.ts';
const host=document.querySelector('#reward');
function render(points){document.querySelector('#preview-status').textContent='';const xp=points===2?210:10,end=points===0?90:points===1?100:300;renderXpReward(host,{lifetime_xp:end,final_xp:xp,streak_multiplier:1,streak_days:1,skill_points_earned:points,current_skill_budget:35+Math.floor(end/100),game_type:'solo',details:{}},{lifetimeXp:end,currentSkillBudget:35+Math.floor(end/100),earnedSkillPoints:Math.floor(end/100),maxSkillBudget:43,xpPerSkillPoint:100,currentXpTowardNextSkillPoint:end%100,currentPlayStreak:1,lifetimePlayerCreationXpAwards:3},()=>{document.querySelector('#preview-status').textContent='Upgrade action received';});}
document.querySelectorAll('[data-points]').forEach(button=>button.onclick=()=>render(Number(button.dataset.points)));
document.querySelector('dialog').showModal();render(1);
</script></body></html>
