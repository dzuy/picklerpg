<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Court environments</title><style>body{margin:0;font:14px system-ui;background:#091426;color:white}header{position:fixed;inset:0 0 auto;z-index:2;padding:10px;background:#091426e8;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{padding:8px 12px;background:#233b53;color:white;border:1px solid #52788a;border-radius:6px;cursor:pointer}button[aria-pressed=true]{background:#176c70}#court{position:absolute;inset:65px 0 0;overflow:hidden}.player-label,.turn-arrow,.serve-bubble,.thinking-bubble,.paused-ball-marker,.serve-aim-hint{display:none}</style><header><strong>Court preview</strong><span id="locations"></span><button id="close">Close view</button><button id="wide">Wide view</button><button id="ball">Ball in air</button></header><div id="court"></div><script type="module">
import {preloadAthletes} from '/src/athlete.ts';import {CourtScene} from '/src/scene.ts';import {Match} from '/src/match.ts';import {COURT_LOCATIONS} from '/src/locations.ts';
await preloadAthletes();const scene=new CourtScene(document.querySelector('#court')),match=new Match();scene.setGuides(false);scene.setPlayerNames(false);
for(const court of COURT_LOCATIONS){const b=document.createElement('button');b.textContent=court.name;b.onclick=()=>{scene.setLocation(court.id);for(const o of document.querySelectorAll('#locations button'))o.setAttribute('aria-pressed',String(o===b))};document.querySelector('#locations').append(b);if(court.id===(new URLSearchParams(location.search).get('court')||'city'))b.click();}
document.querySelector('#ball').onclick=()=>{match.state.ball.position={x:1,y:1.8,z:1};};
document.querySelector('#close').onclick=()=>scene.resetCamera(0);document.querySelector('#wide').onclick=()=>scene.resetCamera(70);
function frame(now){scene.render(match.state,now/1000,match.shot);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
