<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shot picker preview</title>
<link rel="stylesheet" href="/src/style.css">
<style>
body{margin:0;background:linear-gradient(135deg,#0b3986,#092657);color:white;font:15px system-ui;min-height:100dvh}main{padding:16px}#checks{font-size:13px;max-width:360px}#reopen{padding:12px;border-radius:10px}#court{position:fixed;inset:130px 12px 12px;border:2px solid #a6d7db77;background:linear-gradient(90deg,transparent 49.7%,#a6d7db77 50%,transparent 50.3%),linear-gradient(0deg,#224a6455 49.7%,#a6d7db77 50%,#34592c55 50.3%);pointer-events:none}
</style>
<main><button id="reopen">Open shot picker</button><p id="checks">Running checks…</p><p id="played"></p></main><div id="court"></div>
<script type="module">
import {CourtTargetPicker} from '/src/target-picker.ts';
import {Match} from '/src/match.ts';
import {interpretShot} from '/src/shot-description.ts';
const base=new Match().targetingMenu[0].intent;
const choices=[['reset','air'],['lob','air'],['dink','bounce'],['reset','bounce'],['drive','bounce'],['overhead','air'],['counter','air'],['block','air'],['flick','air']].map(([type,timing])=>({intent:{...base,type},timing}));
let lastPlay=null,fail=false;
const source={incoming:'Strong overhead smash incoming',async describe(text,point,signal){const parsed=await interpretShot(text,{opening:'rally',selectedTarget:point},signal);signal.throwIfAborted();document.querySelector('#played').textContent=`Interpreted: ${parsed.spinStrength} ${parsed.spin}, ${parsed.shot}, ${parsed.target}`;},assess(choice){return {risk:choice.intent.type==='lob'?'High':'Low',pressure:choice.intent.type==='reset'?'Low':'High'};},team:'home',choices,context:{},decision:'test',enabled:true,validate(){},play(choice,point){if(fail)throw Error('That shot is no longer available. Choose another shot.');lastPlay={choice,point};document.querySelector('#played').textContent=`Played ${choice.intent.type}, ${choice.timing}`;}};
const scene={onCourtTap:null,setSelectedTarget(){},setShotPreview(){},projectTarget(){return {x:innerWidth/2,y:140}}};
const picker=new CourtTargetPicker(source,scene),point={x:1,z:-3};
function open(){picker.sync(true);scene.onCourtTap(point)}
const assert=(condition,message)=>{if(!condition)throw Error(message)};
try{
 open();const list=document.querySelector('.target-shots');
 assert(document.querySelectorAll('.target-shot').length===9,'All choices in scroll list');
 assert(!document.querySelector('.target-picker-pages'),'No pagination controls');
 assert(list.scrollHeight>list.clientHeight,'Options scroll');
 const row=document.querySelector('.target-shot').getBoundingClientRect().height;
 assert(list.clientHeight>=row*3&&list.clientHeight<row*4,'Three visible rows plus a glimpse');
 assert(document.querySelectorAll('.target-shot:first-child .shot-rating-bars i').length===6,'Three bars per metric');
 assert(document.querySelectorAll('.target-shot:first-child .shot-rating-bars .is-filled').length===2,'Low ratings fill one bar each');
 assert(document.querySelectorAll('.target-shot:nth-child(2) .shot-rating-bars .is-filled').length===6,'High ratings fill three bars each');
 assert(document.querySelector('.target-shot-rating').getAttribute('aria-label')==='Risk: Low (1 of 3)','Accessible rating labels');
 const description=document.querySelector('.target-shot-description input');description.value='Soft crosscourt dink';description.dispatchEvent(new Event('input',{bubbles:true}));
 list.scrollTop=list.scrollHeight;
 document.querySelectorAll('.target-shot')[8].click();assert(lastPlay.choice.intent.type==='flick','Last shot reachable');
 open();assert(document.querySelector('.target-shot-description input').value==='Soft crosscourt dink','Draft survives reopening');
 document.body.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,pointerId:42}));document.body.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,pointerId:42}));document.body.click();assert(!picker.active,'Outside dismissal');
 source.decision='next';open();assert(document.querySelector('.target-shot-description input').value==='','New decision clears draft');
 document.querySelector('#checks').textContent='Passed: three visible rows, scrollable options, risk and pressure labels, last shot reachable, draft persistence, outside dismissal.';
}catch(error){document.querySelector('#checks').textContent=`FAILED: ${error.message}`;throw error;}
if(new URLSearchParams(location.search).has('atp')){
 picker.clear();choices.push({intent:{...base,type:'drive',technique:'atp'},timing:'bounce'});source.decision='atp';source.assess=()=>({risk:'High',pressure:'High'});open();
 assert(document.querySelector('.target-shot').classList.contains('target-shot-atp'),'ATP sorted first');
 assert(document.querySelectorAll('.target-shot-atp').length===1,'One ATP alert');
 document.querySelector('#checks').textContent='Passed: ATP alert appears first with description and ratings.';
}
document.querySelector('#reopen').onclick=open;
window.addEventListener('resize',()=>picker.sync(true));
</script>
