<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compact completion preview</title><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/account-xp.css"><body><dialog id="game-end"><div class="game-end-card"><div class="game-end-kicker">GAME COMPLETE</div><div class="game-end-emblem">✦</div><p class="game-end-label">THE WINNERS</p><h1 id="game-end-title">Anna Leigh Waters &amp; Nico</h1><div class="game-end-score"><div><strong>6</strong><span>Anna Leigh Waters &amp; Nico</span></div><span class="game-end-dash">–</span><div><strong>4</strong><span>Ivy &amp; Nico</span></div></div><section class="account-xp"><div class="xp-reward"><p class="xp-reward-label">YOU EARNED XP!</p><strong class="xp-reward-amount">+10 XP</strong><progress max="100" value="56" aria-label="XP toward next Skill Point"></progress><p class="xp-reward-next">44 to your next Skill Point</p><a class="xp-reward-profile-link" href="#">See your total XP</a></div></section><details class="game-end-stats" hidden><summary class="game-end-stats-heading"><h2>Game stats</h2><p>10 rallies · 41 shots</p></summary><div><article>Game details</article></div></details><div class="game-end-actions"><button id="game-end-new">New Game</button><button id="game-end-rematch">Rematch</button></div></div></dialog><script type="module">
import {rematchSection,bindRematchLifecycle} from '/src/rematch-presentation.ts';
import {RematchCountdown} from '/src/rematch-countdown.ts';
const dialog=document.querySelector('dialog'),button=document.querySelector('#game-end-rematch'),view=rematchSection(dialog,button);
document.querySelector('.game-end-score').after(document.querySelector('.account-xp'));
const now=document.createElement('button');now.textContent='Not Now';document.querySelector('.game-end-actions').append(now);
let active=()=>dialog.open&&!document.hidden;
const timer=new RematchCountdown({getItem:()=>null,setItem:()=>{}},()=>active(),()=>{view.renderCountdown(timer.remaining);view.message.textContent=timer.remaining===null?'Ready when you are.':'Rematch request sending automatically…';},()=>{view.title.textContent='REMATCH SENT';view.message.textContent='Waiting for Nico…';button.textContent='CONFIRM REMATCH';});
active=bindRematchLifecycle(dialog,button,timer);button.textContent='REMATCH NOW';view.opponent.textContent='vs Nico';
button.onclick=()=>{timer.cancel();view.title.textContent='REMATCH SENT';view.message.textContent='Waiting for Nico…';button.disabled=true;};now.onclick=()=>timer.cancel();
dialog.showModal();timer.start('preview');
</script></body></html>
