<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Full Game Analysis · Design Preview</title><style>body{margin:0;padding:24px;box-sizing:border-box;background:var(--pb-surface-inset);font-family:var(--pb-font-body);color:var(--pb-text)}#game-end{max-width:430px;margin:40px auto;background:var(--pb-surface);padding:24px;border-radius:24px;text-align:center}#game-end h1{font-size:28px}.preview-note{font-size:12px;text-align:center}.game-end-actions{display:flex;gap:10px;justify-content:center}.game-end-actions button,.example-button{padding:12px;border-radius:24px;border:1px solid var(--pb-border-strong);background:var(--pb-surface);color:var(--pb-text)}</style><body><p class="preview-note">Design preview · Example report</p><section id="game-end"><small>GAME COMPLETE</small><h1>Anna Leigh & dzuy</h1><h2>7 – 5</h2><p>vs Nico & Max</p><div class="game-end-actions"><button>New Game</button><button>Rematch</button></div></section><p style="text-align:center"><button class="example-button">Preview report layout</button> <button class="example-button loading-preview">Preview loading animation</button></p><script type="module">
