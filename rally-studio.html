<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rally Studio · PickleBash</title><link rel="stylesheet" href="/src/design-system/tokens.css"></head>
<body><header class="studio-header"><a href="/">PICKLEBASH<span> / RALLY STUDIO</span></a><span class="local-badge">LOCAL CREATIVE TOOLS</span></header>
<main class="studio-layout"><aside class="studio-controls">
<form id="studio-form"><label for="brief">Describe your clip</label><textarea id="brief" rows="3" maxlength="500">3-5 hit rally that ends with someone getting body bagged</textarea><div class="suggestions"><button type="button" data-prompt="3-5 hit rally that ends with someone getting body bagged">Body bag</button><button type="button" data-prompt="6-12 hit rally with a dink">Dink battle</button><button type="button" data-prompt="3-8 hit rally with an overhead winner">Overhead winner</button></div>

<div class="field-pair"><div><label for="scope">Clip scope</label><select id="scope"><option value="full">Complete rally, including serve</option><option value="finish">Finishing excerpt</option></select></div><div><label for="game-type">Game type</label><select id="game-type"><option value="side-out-doubles">Doubles · side-out</option><option value="rally-doubles">Doubles · rally scoring</option></select></div></div>
<div class="field-pair"><div><label for="location">Court</label><select id="location"></select></div><div><label for="theme">Court atmosphere</label><select id="theme"></select></div></div>
<div class="studio-display-controls"><label><input id="names" type="checkbox"> Show player names</label><label><input id="guides" type="checkbox"> Show guide lines</label><label for="selector-player">Shot selector</label><select id="selector-player"><option value="">Off · autoplay everyone</option><option value="you" selected>Player 1 · Alex</option><option value="partner">Player 2 · Sam</option><option value="opponent-left">Player 3 · Jules</option><option value="opponent-right">Player 4 · Rio</option></select></div><details open><summary>Players <span>4 ON COURT</span></summary><button id="shuffle-outfits" type="button">Shuffle outfits · includes Premium</button><input id="outfit-seed" type="hidden" value="1"><div id="lineup"></div><p class="hint">Choose a saved local character or a studio player. Styles use real skills; changes here leave your roster untouched.</p></details>
<div class="field-pair"><div><label for="seed">Starting seed</label><input id="seed" type="number" min="0" max="4294967295" step="1" value="1741" required></div><div><label for="budget">Search budget</label><select id="budget"><option value="100">100 rallies</option><option value="300" selected>300 rallies</option><option value="1000">1,000 rallies</option></select></div></div>
<button id="generate" class="primary" type="submit">Find my rally <span>↗</span></button><button id="cancel" type="button" hidden>Cancel search</button><p id="status" role="status" aria-live="polite">Loading the court…</p></form>
</aside><section class="studio-preview" aria-label="Recording studio"><div class="preview-heading"><span id="dimensions">390 × 693 · 9:16</span></div>
<div class="stage-surround"><div id="recording-frame"><div id="studio-court"></div><div id="clip-brand"><img src="/images/start/picklebash-logo.png" width="1672" height="941" alt="PickleBash" draggable="false"></div><div id="clip-caption"></div><div id="countdown" hidden></div></div></div>
<div class="transport"><button id="replay" disabled aria-label="Replay from start">↺ Replay</button><button id="play" disabled>Play</button><input id="timeline" aria-label="Clip timeline" type="range" min="0" max="1" step="0.016667" value="0" disabled><output id="time">0:00 / 0:00</output><select id="speed" aria-label="Playback speed"><option value="0.25">¼ speed</option><option value="0.5">½ speed</option><option value="1" selected>1× speed</option><option value="1.5">1.5× speed</option></select></div>
<div class="preview-options"><label><input id="loop" type="checkbox" checked> Loop</label><label><input id="branding" type="checkbox" checked> Branding</label><select id="format" aria-label="Recording dimensions"><option value="390,693">9:16 · 390 × 693</option><option value="390,844">Phone · 390 × 844</option><option value="540,960">9:16 · 540 × 960</option></select><button id="camera">Reset camera</button><button id="record" disabled>Recording view ↗</button></div>
</section></main><button id="exit-recording" hidden>Exit recording · Esc</button><script type="module" src="/src/rally-studio.ts"></script></body></html>
